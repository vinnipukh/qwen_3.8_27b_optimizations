                  - code [ref=e1968]: llama.cpp
                  - text: is to enable LLM (and VLM) inference with minimal setup and state-of-the-art performance on a wide range of hardware - locally and in the cloud.
                - list [ref=e1969]:
                  - listitem [ref=e1970]: Plain C/C++ implementation without any dependencies
                  - listitem [ref=e1971]: Apple silicon is a first-class citizen - optimized via ARM NEON, Accelerate and Metal frameworks
                  - listitem [ref=e1972]: AVX, AVX2, AVX512 and AMX support for x86 architectures
                  - listitem [ref=e1973]: RVV, ZVFH, ZFH, ZICBOP and ZIHINTPAUSE support for RISC-V architectures
                  - listitem [ref=e1974]: 1.5-bit, 2-bit, 3-bit, 4-bit, 5-bit, 6-bit, and 8-bit integer quantization for faster inference and reduced memory use
                  - listitem [ref=e1975]: Custom CUDA kernels for running LLMs on NVIDIA GPUs (support for AMD GPUs via HIP and Moore Threads GPUs via MUSA)
                  - listitem [ref=e1976]: Vulkan and SYCL backend support
                  - listitem [ref=e1977]: CPU+GPU hybrid inference to partially accelerate models larger than the total VRAM capacity
                - paragraph [ref=e1978]:
                  - text: The
                  - code [ref=e1979]: llama.cpp
                  - text: project is build on top of the
                  - link "ggml" [ref=e1980] [cursor=pointer]:
