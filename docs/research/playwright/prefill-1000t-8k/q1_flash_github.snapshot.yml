                - paragraph [ref=e896]:
                  - text: The Triton backend uses a default kernel configuration optimized for determinism and reasonable performance across workloads. For peak throughput, enable
                  - code [ref=e897]: FLASH_ATTENTION_TRITON_AMD_AUTOTUNE="TRUE"
