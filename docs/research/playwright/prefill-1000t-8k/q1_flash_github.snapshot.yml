                    - generic [ref=e881]: "\"TRUE\""
                    - text: pip install --no-build-isolation .
                  - button "Copy code to clipboard" [ref=e883] [cursor=pointer]
                - paragraph [ref=e887]: "To run the tests (note: full suite takes hours):"
