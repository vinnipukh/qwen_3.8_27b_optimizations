                    - /url: "#triton-backend"
                - paragraph [ref=e863]:
                  - text: The Triton implementation of
                  - link "Flash Attention" [ref=e864] [cursor=pointer]:
                    - /url: https://tridao.me/publications/flash2/flash2.pdf
                  - text: supports AMD's CDNA (MI200, MI300) and RDNA GPUs using fp16, bf16, and fp32 datatypes. It provides forward and backward passes with causal masking, variable sequence lengths, arbitrary Q/KV sequence lengths and head sizes, MQA/GQA, dropout, rotary embeddings, ALiBi, paged attention, and FP8 (via the Flash Attention v3 interface). Sliding window attention is currently a work in progress.
                - paragraph [ref=e865]:
                  - text: The Triton backend kernels are provided by the
                  - link "aiter" [ref=e866] [cursor=pointer]:
                    - /url: https://github.com/ROCm/aiter
                  - text: package, included as a git submodule at
                  - code [ref=e867]: third_party/aiter
                  - text: and automatically installed during setup.
                - paragraph [ref=e868]:
                  - text: To install, first get PyTorch for ROCm from
                  - link "https://pytorch.org/get-started/locally/" [ref=e869] [cursor=pointer]:
                    - /url: https://pytorch.org/get-started/locally/
                  - text: ", then install Flash Attention:"
