                  - generic [ref=e871]:
                    - text: cd flash-attention FLASH_ATTENTION_TRITON_AMD_ENABLE=
                    - generic [ref=e872]: "\"TRUE\""
                    - text: pip install --no-build-isolation .
                  - button "Copy code to clipboard" [ref=e874] [cursor=pointer]
                - paragraph [ref=e878]: "To use a specific aiter commit (e.g., for testing or development):"
