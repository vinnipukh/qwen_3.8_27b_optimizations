            - paragraph [ref=e218]: "TL;DR: KV Cache Quantization reduces memory usage for long-context text generation in LLMs with minimal impact on quality, offering customizable trade-offs between memory efficiency and generation speed."
            - paragraph [ref=e219]: Have you ever tried generating a lengthy piece of text with your language model, only to hit a wall because of pesky memory limitations? As language models continue to grow in size and capabilities, supporting longer generations can start to really eat up memory. It's a common frustration, especially when you're dealing with limited resources. That's where kv cache quantization swoops in to save the day.
            - paragraph [ref=e220]:
              - text: "So, what exactly is kv cache quantization? If you're not familiar with the term, don't sweat it! Let's break it down into two pieces:"
              - emphasis [ref=e221]: kv cache
              - text: and
              - emphasis [ref=e222]: quantization
              - text: .
            - paragraph [ref=e223]: Key-value cache, or kv cache, is needed to optimize the generation in autoregressive models, where the model predicts text token by token. This process can be slow since the model can generate only one token at a time, and each new prediction is dependent on the previous context. That means, to predict token number 1000 in the generation, you need information from the previous 999 tokens, which comes in the form of some matrix multiplications across the representations of those tokens. But to predict token number 1001, you also need the same information from the first 999 tokens, plus additional information from token number 1000. That is where key-value cache is used to optimize the sequential generation process by storing previous calculations to reuse in subsequent tokens, so they don't need to be computed again.
            - paragraph [ref=e224]:
              - text: More concretely, key-value cache acts as a memory bank for autoregressive generative models, where the model stores key-value pairs derived from self-attention layers for previously processed tokens. In the transformer architecture, self-attention layers calculate attention scores by multiplying queries with keys, producing weighted sums of value vectors as outputs. By storing this information, the model can avoid redundant computations and instead retrieve keys and values of previous tokens from the cache. For a visual explanation of this concept, take a look at how key-value cache functions in the image below. When calculating the attention scores for the
              - code [ref=e225]: K+1
              - text: th token we do not need to recompute all of the previous keys and values, but rather take it from cache and concatenate to the current vector. This usually results in faster and more efficient text generation.
            - figure [ref=e226]:
              - img "kv cache visual" [ref=e227]
            - paragraph [ref=e228]:
              - text: Moving on to the second term, quantization is just a fancy word for reducing the precision of numerical values to save memory. During quantization, each numerical value is rounded or truncated to fit within the reduced precision format, which may result in a loss of information. However, careful selection of quantization parameters and techniques can minimize this loss while still achieving satisfactory performance. There are different quantization methods, so if you're curious to learn more be sure to check out our
              - link "previous blog post" [ref=e229] [cursor=pointer]:
                - /url: https://huggingface.co/blog/4bit-transformers-bitsandbytes
              - text: for a deeper dive into the world of quantization.
            - paragraph [ref=e230]:
              - text: Even though kv cache speeds up autoregressive generation, it can become a memory bottleneck with long context length or high batch size. Let's estimate how much memory we will need to store kv cache for an input of sequence length 10000 tokens for a 7B Llama-2 model. The memory required to store kv cache of one token is roughly
              - code [ref=e231]: 2 * 2 * num_layers * num_key_value_heads * head_dim
              - text: ", where the first"
              - code [ref=e232]: "2"
              - text: accounts for keys and values and the second
              - code [ref=e233]: "2"
              - text: is the number of bytes we need (assuming the model is loaded in
              - code [ref=e234]: float16
              - text: ). So if we have a context of length 10000 tokens, we would need
            - paragraph [ref=e235]:
              - code [ref=e236]: 2 * 2 * 32 * 32 * 128 * 10000 ≈ 5GB
            - paragraph [ref=e237]: of memory only to store the previous key-value cache, which is almost one third of the memory required to store model parameters in half-precision.
            - paragraph [ref=e238]: Therefore, by compressing kv cache into a more compact form we can save up a lot of memory and run longer context generation on consumer GPUs. In our experiments, we were able to significantly reduce the memory footprint without sacrificing too much quality by quantizing the kv cache into lower precision formats. With this new quantization feature, we can now support longer generations without running out of memory, which means you can expand your model's context length without worrying about hitting a memory constraint.
            - heading "Implementation Details" [level=2] [ref=e239]:
              - link [ref=e240] [cursor=pointer]:
                - /url: "#implementation-details"
            - paragraph [ref=e245]:
              - text: Key-value cache quantization in Transformers was largely inspired by the
              - 'link "KIVI: A Tuning-Free Asymmetric 2bit Quantization for kv Cache" [ref=e246] [cursor=pointer]':
                - /url: https://arxiv.org/abs/2402.02750
              - text: paper. The paper introduced a 2bit asymmetrical quantization for large language models without quality degradation. KIVI quantizes the key cache per-channel and the value cache per-token, because they showed that for LLMs keys have higher magnitudes of outliers in some channels while values don't show such a pattern. Therefore, the relative error between quantized and original precision is much smaller when keys are quantized per-channel and the values per-token.
            - paragraph [ref=e247]: In the method we integrated in Transformers the key and values are both quantized per-token. The main bottleneck when quantizing per-token is the need to quantize and de-quantize keys and values every time a new token is added, that is every generation step. That might cause a slow down in generation. To overcome this issue we decided to retain a fixed size residual cache to store keys and values in their original precision. When the residual cache reaches its maximum capacity the stored keys and values are quantized and the cache content is discarded. This small trick also allows preserving accuracy since some part of the most recent keys and values are always stored in their original precision. The main consideration is the memory-efficiency trade-off when setting the residual cache length. While residual cache stores keys and values in their original precision, that may result in overall memory usage increase. We found that using a residual length of 128 works well as a baseline.
            - paragraph [ref=e248]:
              - text: So given a key or value of shape
              - code [ref=e249]: batch size, num of heads, num of tokens, head dim
              - text: we group it to
              - code [ref=e250]: num of groups, group size
              - text: "and perform affine quantization as follows:"
            - paragraph [ref=e251]:
              - code [ref=e252]: X_Q = round(X / S) - Z
            - paragraph [ref=e253]: where,
            - list [ref=e254]:
