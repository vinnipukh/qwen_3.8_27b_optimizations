            - paragraph [ref=e339]:
              - text: Now, let's talk about the trade-off between memory savings and speed. When we quantize the kv cache in models, we're making them less memory hungry, but sometimes that comes at a tiny cost to generation speed. While quantizing the cache to
              - code [ref=e340]: int4
              - text: can offer roughly an x2.5 memory saving, the generation speed starts to decrease with higher batch sizes. One has to decide whether using quantized kv cache and potentially sacrificing a bit of speed is worth the trade-off for the significant gains in memory efficiency. It's all about finding the approach that best suits your specific use case and priorities.
            - paragraph [ref=e341]:
              - text: Below are the performance metrics for kv cache in original precision and quantized format. Script to obtain the following figures is available
              - link "here" [ref=e342] [cursor=pointer]:
                - /url: https://gist.github.com/zucchini-nlp/56ce57276d7b1ee666e957912d8d36ca
              - text: .
            - figure [ref=e343]:
              - img "GPU memory consumption as max new tokens increase" [ref=e344]
            - figure [ref=e345]:
              - img "GPU memory consumption as batch size increases" [ref=e346]
            - figure [ref=e347]:
              - img "Latency as batch size increases" [ref=e348]
            - paragraph [ref=e349]:
              - text: Wondering what happens when we throw weight quantization into the mix? Sure, combining these techniques can further slim down your model's memory footprint, but there's a catch – it might slow things down even more. In fact, our experiments show that weight quantization together with kv cache quantization can lead to a threefold decrease in speed. But we're constantly tinkering away to find ways to make this combo work seamlessly. And while we don't currently have optimized kernels in the
              - code [ref=e350]: quanto
              - text: library, we're open to community contributions that could help improve computational efficiency. Our goal is to ensure your model runs smoothly while maintaining high latency and accuracy.
            - paragraph [ref=e351]:
              - text: It's also worth noting that initial processing of the input prompt (aka pre-fill stage) still requires computing the entire key-value matrices in one go for the whole input, which may be another memory bottleneck for long contexts. This is the reason why the latency associated with generating the first token tends to be higher compared to subsequent tokens. There are other different strategies to decrease the memory burden of the pre-fill stage by optimizing the attention computation stage, such as
              - link "Local Windowed Attention" [ref=e352] [cursor=pointer]:
                - /url: https://arxiv.org/abs/2004.05150
              - text: or
              - link "Flash-Attention" [ref=e353] [cursor=pointer]:
                - /url: https://arxiv.org/abs/2307.08691
              - text: . If you are out of memory for the pre-fill stage, you can use
              - code [ref=e354]: FlashAttention
              - text: in 🤗 Transformers along with the kv cache quantization to decrease memory usage even more for long input prompts. See
              - link "the docs" [ref=e355] [cursor=pointer]:
                - /url: https://huggingface.co/docs/transformers/main/en/perf_infer_gpu_one#flashattention-2
              - text: for more information on that.
            - paragraph [ref=e356]: If you are interested in how many tokens we can fit in the context, with memory usage pushed to its limits, a quantized kv cache can support up to 128k tokens with Flash Attention enabled in an 80GB A100. For the cache in half precision, the maximum capacity is 40k tokens.
            - heading "How to use quantized kv cache in 🤗 Transformers?" [level=2] [ref=e357]:
              - link [ref=e358] [cursor=pointer]:
                - /url: "#how-to-use-quantized-kv-cache-in-🤗-transformers"
            - paragraph [ref=e363]:
              - text: To use kv cache quantization in 🤗 Transformers we have to install external dependencies first by running
              - code [ref=e364]: pip install quanto
              - text: . To activate quantization on kv cache, we have to pass in
              - code [ref=e365]: cache_implementation="quantized"
              - text: and indicate quantization parameters in a cache config in dictionary format. And that's all we need to start using kv cache quantization. Additionally, since quanto is device agnostic, you can quantize and run your model regardless if you are on CPU/GPU/MPS (Apple Silicon).
            - paragraph [ref=e366]:
