              - text: . Although we don't currently support more quantization backends, we are open to community contributions that could help integrate them. Specifically, quantization methods that do not need calibration data and can dynamically calculate lower-bit tensors on-the-fly can be easily integrated. Additionally, you can indicate the most common quantization parameters in the config, thus have freedom to tweak the quantization process, e.g. decide whether to perform per-channel or per-token quantization depending on your use case.
            - heading "Comparing performance of fp16 and quantized cache" [level=2] [ref=e271]:
