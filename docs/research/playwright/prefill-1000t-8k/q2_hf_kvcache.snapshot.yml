              - listitem [ref=e256]:
                - text: S is the scale, calculated as
                - code [ref=e257]: (maxX - minX) / (max_val_for_precision - min_val_for_precision)
              - listitem [ref=e258]:
                - text: Z is the zeropoint, calculated as
                - code [ref=e259]: round(-minX / S)
